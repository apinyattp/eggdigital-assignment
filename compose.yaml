name: eggdigital-login
services:
  db:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: meeting_manager
      POSTGRES_DB: meeting_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run backend setup:local and pass backend/.local.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U meeting_manager -d meeting_manager"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./backend
      target: development
    environment:
      PORT: '3001'
      DATABASE_URL: postgresql://meeting_manager:${POSTGRES_PASSWORD}@db:5432/meeting_manager
      ALLOWED_ORIGIN: http://localhost:3000
      JWT_SIGNING_KEY_BASE64: ${JWT_SIGNING_KEY_BASE64:?Run backend setup:local}
      JWT_ISSUER: urn:meeting-manager:local
      JWT_AUDIENCE: urn:meeting-manager:api
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      COOKIE_SECURE: 'false'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LOGIN_FIXTURE_PASSWORD: ${LOGIN_FIXTURE_PASSWORD:?Run backend setup:local}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:-}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      AUTH_BACKEND_INTERNAL_URL: http://backend:3001
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:-}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      COOKIE_SECURE: 'false'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
