<div class="reviewbar"><div><strong>WIREFRAME / v1</strong> &nbsp; ต้นแบบสำหรับทดลอง · ข้อมูลสมมติ</div><nav class="reviewlinks" aria-label="Prototype review"><a href="#login">01 Login</a><a href="#dashboard">02 Dashboard</a><a href="#booking">03 Booking</a><a href="#detail">04 Summary</a><a href="#review">อ่านคู่มือ</a></nav></div>
<div id="app" class="shell"></div><div id="modal-root"></div>
<script>
const records=[{id:1,name:'Mali Demo',role:'Software Engineer',title:'Technical interview — Mali Demo',date:'2026-10-12',start:'10:00',end:'11:00',status:'Confirmed',type:'Online',provider:'Google Meet',location:'',description:'Discuss problem solving and recent project work.',notes:'Prepare one example of a technical trade-off.'},{id:2,name:'Narin Sample',role:'Backend',title:'Backend interview — Narin Sample',date:'2026-10-12',start:'13:00',end:'14:00',status:'Pending',type:'Onsite',provider:'',location:'Demo office · Room A',description:'Discuss API design.',notes:''},{id:3,name:'Pim Example',role:'Frontend',title:'Frontend interview — Pim Example',date:'2026-10-13',start:'09:00',end:'10:00',status:'Confirmed',type:'Online',provider:'Zoom',location:'',description:'Discuss interface implementation.',notes:''},{id:4,name:'Tawan Demo',role:'Software Engineer',title:'Technical interview — Tawan Demo',date:'2026-10-14',start:'14:00',end:'15:00',status:'Pending',type:'Online',provider:'Google Meet',location:'',description:'Discuss team collaboration.',notes:''}];
let selected=1,page=1,state='normal',notice='',currentScreen='',feedback=[],savedNotes='',editMode=false,modalReturn;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=()=>records.find(x=>x.id===selected)||records[0];const dateText=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const btn=(text,action,cls='')=>`<button type="button" class="${cls}" onclick="${action}">${text}</button>`;
const go=s=>{location.hash=s};const footer=()=>'<div class="footer">LOW-FIDELITY PROTOTYPE · ทุกชื่อและรายการเป็นข้อมูลสมมติ</div>';
function chrome(content,nav='dashboard'){return `<header><div class="brand"><div class="logo">LOGO</div><span>Candidate<br>Meeting Scheduler</span></div><div class="identity"><div><small>Logged in as</small><strong>Kanda Demo</strong></div>${btn('Logout',"go('login')")}</div></header><div class="layout"><aside><div class="label">WORKSPACE</div><a class="${nav==='dashboard'?'active':''}" href="#dashboard">Upcoming Meetings</a><a class="${nav==='booking'?'active':''}" href="#booking">Schedule a Meeting</a><div class="label" style="margin-top:35px">EXTENSION DRAFT</div><a class="${nav==='extensions'?'active':''}" href="#extensions">New / Room / Calendar</a><div class="aside-note">หน้าจอทดลองสำหรับจัดการนัดสัมภาษณ์<br><br>ไม่มีการเชื่อมบริการจริง</div></aside><main>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${content}${footer()}</main></div>`}
function login(){return `<div class="loginwrap"><section class="loginintro"><div class="logo">LOGO</div><div class="eyebrow" style="margin-top:35px">01 / ACCESS</div><h1>Candidate<br>Meeting Scheduler</h1><p class="sub">จัดการนัดสัมภาษณ์ และข้อมูลประกอบการพูดคุยในที่เดียว</p><div class="placeholder">COMPANY VISUAL PLACEHOLDER</div></section><section class="loginbox"><div class="step">ยินดีต้อนรับ / บัญชีตัวอย่างสำหรับเดโม</div><h2 style="font-size:26px">Login</h2><p class="sub">เข้าสู่ระบบเพื่อดูและจัดการนัดสัมภาษณ์</p><form onsubmit="loginSubmit(event)" novalidate><div id="login-error" aria-live="polite"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="off" value="kanda.demo@example.test"></div><div class="field"><label for="password">Password</label><input id="password" type="password" value="demo-only" autocomplete="off"></div><button class="primary" type="submit">Login</button></form><div class="note">แบบคลิกทดลอง: แสดงลำดับเข้าสู่ระบบเท่านั้น<br>ไม่ตรวจบัญชีจริง กรุณาไม่กรอกข้อมูลจริง</div><div class="state-controls">Preview state ${btn('Login error',"$('#login-error').innerHTML='<div class=error>อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</div>'")}</div>${footer()}</section></div>`}
function loginSubmit(e){e.preventDefault();if(!$('#email').value.includes('@')||!$('#password').value){$('#login-error').innerHTML='<div class="error" role="alert">กรอกอีเมลและรหัสผ่านให้ครบ</div>';return}notice='เข้าสู่ระบบตัวอย่าง · Kanda Demo';go('dashboard')}
function controls(){return `<div class="state-controls">Preview state ${['normal','loading','empty','error'].map(x=>btn(x,`setState('${x}')`)).join('')}<span>ตัวควบคุมนี้ใช้ทบทวนแบบเท่านั้น</span></div>`}
function setState(s){state=s;render()}
function dashboard(){let items=records.slice((page-1)*3,page*3);let content=`<div class="heading"><div><div class="eyebrow">02 / MEETING LIST</div><h1>Upcoming Meetings</h1><p class="sub">นัดสัมภาษณ์ที่กำลังจะมาถึง · เวลาในตัวอย่าง: Bangkok (UTC+7)</p></div>${btn('+ Schedule a Meeting',"go('booking')",'primary')}</div>`;
if(state==='loading')content+=`<div role="status"><p class="sub">กำลังโหลดนัดสัมภาษณ์…</p>${[1,2,3].map(()=>'<div class="panel" style="margin-bottom:16px"><div class="skeleton"></div><div class="skeleton" style="width:40%"></div></div>').join('')}</div>`;
else if(state==='empty'||!records.length)content+=`<div class="panel empty"><div class="symbol">□</div><h2>ยังไม่มีนัดสัมภาษณ์</h2><p class="sub">เริ่มจากเพิ่มผู้สมัครและเวลาที่ต้องการนัด</p>${btn('Schedule a Meeting',"go('booking')",'primary')}</div>`;
else if(state==='error')content+=`<div class="panel empty" role="alert"><div class="symbol">!</div><h2>โหลดรายการไม่ได้</h2><p class="sub">ลองโหลดอีกครั้ง โดยยังไม่เปลี่ยนข้อมูลเดิม</p>${btn('Try again',"setState('normal')",'primary')}</div>`;
else content+=`<div class="row between" style="margin-bottom:16px"><span class="sub">${records.length} upcoming meetings</span><span class="sub">เรียงวันและเวลาใกล้ที่สุดก่อน · ข้อเสนอ</span></div><div class="cards">${items.map(x=>`<article class="card"><div><h3>${esc(x.name)} <span style="font-weight:400">— ${esc(x.role)}</span></h3><p>${esc(x.title)}</p><p class="date">${dateText(x.date)} · ${x.start}–${x.end}</p><p>${x.type==='Onsite'?esc(x.location):`${x.type} · ${esc(x.provider)} (ตัวอย่าง)`}</p></div><div class="actions"><span class="badge ${x.status==='Pending'?'pending':''}">${esc(x.status)}</span>${btn('View Details',`selected=${x.id};go('detail')`)}</div></article>`).join('')}</div><div class="pagination"><span>Showing ${(page-1)*3+1}–${Math.min(page*3,records.length)} of ${records.length}</span><div class="row"><button ${page===1?'disabled':''} onclick="page=1;render()">← Previous</button><button class="${page===1?'selected':''}" aria-label="Page 1" onclick="page=1;render()">1</button><button class="${page===2?'selected':''}" aria-label="Page 2" ${records.length<=3?'disabled':''} onclick="page=2;render()">2</button><button ${page===2||records.length<=3?'disabled':''} onclick="page=2;render()">Next →</button></div></div>`;
return chrome(content+`<div class="note">ข้อมูลและสถานะในหน้านี้เป็นตัวอย่าง</div>`+controls())}
const field=(id,label,value='',type='text',extra='')=>`<div class="field ${extra}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}"></div>`;
function booking(edit=false){editMode=edit;let d=edit&&active()?active():{name:'',role:'Software Engineer',title:'',date:'2026-10-12',start:'10:00',end:'11:00',status:'Pending',type:'Onsite',provider:'',location:null,description:'',notes:''};return chrome(`<div class="heading"><div><div class="eyebrow">${edit?'03 / EDIT MEETING':'BOOKING FORM'}</div><h1>${edit?'Edit Meeting':'Schedule a New Meeting'}</h1><p class="sub">${edit?'แก้ข้อมูลนัดเดิม แล้วตรวจสอบก่อนบันทึก':'กรอกข้อมูลผู้สมัครและช่วงเวลานัดสัมภาษณ์'}</p></div>${btn('← Back',`go('${edit?'detail':'dashboard'}')`)}</div><div class="form-layout"><section class="panel"><form id="meeting-form" novalidate onsubmit="saveMeeting(event)"><div id="form-error" tabindex="-1" role="alert"></div><div class="fields">${field('name','Candidate Name *',d.name)}<div class="field"><label for="role">Position *</label><select id="role">${['Software Engineer','Backend','Frontend'].map(x=>`<option ${x===d.role?'selected':''}>${x}</option>`).join('')}</select></div>${field('title','Meeting title *',d.title,'text','span2')}<div class="field span2"><label for="description">Description</label><textarea id="description">${esc(d.description)}</textarea></div>${field('date','Date / due date *',d.date,'date')}<div class="field"><label for="status">Status *</label><select id="status">${['Pending','Confirmed'].concat(d.status==='Cancelled'?['Cancelled']:[]).map(x=>`<option ${x===d.status?'selected':''}>${x}</option>`).join('')}</select><div class="help">ค่าเริ่มต้น Pending เป็นข้อเสนอ</div></div>${field('start','Start time *',d.start,'time')}${field('end','End time *',d.end,'time')}<div class="field"><label for="type">Meeting type *</label><select id="type" onchange="typeChanged()"><option ${d.type==='Online'?'selected':''}>Online</option><option ${d.type==='Onsite'?'selected':''}>Onsite</option></select></div><div class="field" id="provider-wrap" ${d.type==='Onsite'?'hidden':''}><label for="provider">Online provider</label><select id="provider"><option ${d.provider==='Google Meet'?'selected':''}>Google Meet</option><option ${d.provider==='Zoom'?'selected':''}>Zoom</option></select><div class="help">ระบุประเภทเท่านั้น ไม่สร้างลิงก์จริง</div></div><div class="field" id="location-wrap" ${d.type==='Online'?'hidden':''}><label for="location">Location</label><input id="location" value="${esc(d.location)}" placeholder="เช่น Demo office · Room A"></div><div class="field span2"><label for="notes">Notes</label><textarea id="notes" placeholder="ข้อมูลเตรียมตัวสำหรับการสัมภาษณ์">${esc(d.notes)}</textarea></div></div><div class="help" style="margin-bottom:16px">* ช่องบังคับในข้อเสนอ · วันเดียวกัน / เวลาจบหลังเวลาเริ่ม · UTC+7 ในตัวอย่าง</div><div class="form-foot">${btn('Discard changes',`go('${edit?'detail':'dashboard'}')`)}<button class="primary" type="submit">${edit?'Save Changes':'Book Meeting'}</button></div></form></section><section><div class="panel muted-panel"><div class="eyebrow">แบบร่าง / ให้ทบทวน</div><h3>ข้อมูลนัดสัมภาษณ์ตัวอย่าง</h3><p class="sub">Candidate / Position / เวลา / Type / Notes</p><p class="sub">Title / Description / due date / Status</p><div class="line sub">Description และ Notes เป็นข้อมูลแยกกันในแบบฟอร์ม</div></div><div class="note">ไม่มีการบันทึกฐานข้อมูล<br>การกดบันทึกเปลี่ยนเฉพาะข้อมูลในหน้าทดลองนี้</div></section></div>`,'booking')}
function typeChanged(){let online=$('#type').value==='Online';$('#provider-wrap').hidden=!online;$('#location-wrap').hidden=online}
function saveMeeting(e){e.preventDefault();let v={};['name','role','title','date','start','end','status','type','provider','location','description','notes'].forEach(k=>v[k]=$('#'+k).value.trim());let errors=[];if(!v.name)errors.push('กรอกชื่อผู้สมัคร');if(!v.title)errors.push('กรอกชื่อการนัด');if(!v.date||!v.start||!v.end)errors.push('ระบุวันและเวลาให้ครบ');if(v.end<=v.start)errors.push('เวลาจบต้องอยู่หลังเวลาเริ่ม (ข้อเสนอสำหรับนัดวันเดียวกัน)');if(errors.length){$('#form-error').innerHTML=`<div class="error">${errors.join('<br>')}</div>`;$('#form-error').focus();return}if(editMode){Object.assign(active(),v);notice='บันทึกการแก้ไขในต้นแบบแล้ว'}else{v.id=Date.now();records.unshift(v);selected=v.id;notice='สร้างนัดในต้นแบบแล้ว'}state='normal';page=1;go('detail')}
function detail(){let x=active();if(!x)return dashboard();return chrome(`<div class="row between" style="margin-bottom:22px"><div class="eyebrow">04 / CANDIDATE SUMMARY</div>${btn('← All Meetings',"go('dashboard')")}</div><div class="profile"><div class="profilebox">PROFILE</div><div><h1>${esc(x.name)}</h1><p class="sub" style="margin:0">Applied role: ${esc(x.role)} · ข้อมูลผู้สมัครสมมติ</p></div></div><div class="detailgrid"><div class="stack"><section class="panel"><div class="row between" style="margin-bottom:20px"><h2 style="margin:0">Meeting Info</h2><span class="badge ${x.status==='Pending'?'pending':''}">${esc(x.status)}</span></div><dl class="data"><dt>Title</dt><dd>${esc(x.title)}</dd><dt>Date / due date</dt><dd>${dateText(x.date)}</dd><dt>Time</dt><dd>${x.start}–${x.end} · Bangkok (UTC+7)</dd><dt>Meeting type</dt><dd>${esc(x.type)} · ${esc(x.type==='Online'?x.provider:x.location)}</dd><dt>Description</dt><dd>${esc(x.description)||'—'}</dd><dt>Booking notes</dt><dd>${esc(x.notes)||'—'}</dd></dl><div class="row line">${btn('Edit Meeting',"go('edit')",'primary')}${btn('Cancel Meeting',"openModal('cancel')")}</div></section><section class="panel"><h2>Interview Notes</h2><label for="interview-notes">บันทึกประกอบการสัมภาษณ์</label><textarea id="interview-notes" placeholder="จดประเด็นที่ต้องการถามหรือสิ่งที่สังเกตได้">${esc(savedNotes)}</textarea><div class="row between" style="margin-top:12px"><span class="help">วิธีบันทึกและผู้ที่มองเห็นยังเป็นข้อเสนอ</span>${btn('Save Notes',"savedNotes=$('#interview-notes').value;notice='เก็บ notes ในต้นแบบแล้ว';render()")}</div></section></div><div class="stack"><section class="panel"><div class="row between"><h2 style="margin:0">History & Evaluations</h2></div><p class="help" style="margin-bottom:23px">ตัวอย่างโครงสร้าง · ยังไม่กำหนดเกณฑ์ประเมิน</p><div class="history"><strong>02 Oct 2026 · Initial interview</strong><small>ตัวอย่างประวัติของผู้สมัคร</small><p style="margin:8px 0 0">Discussed experience and project interests.</p></div>${feedback.map(f=>`<div class="history"><strong>Feedback draft</strong><p>${esc(f)}</p><small>Kanda Demo · ต้นแบบเท่านั้น</small></div>`).join('')}${btn('+ Add Feedback',"openModal('feedback')")}</section><div class="note">Cancel เสนอให้คงประวัติและเปลี่ยนเป็น Cancelled<br>Delete เป็นการลบรายการแยกต่างหาก<br>ต้องยืนยันผลต่อ history และ Calendar</div></div></div><section class="dangerzone"><div><strong>Delete meeting record</strong><p>ลบข้อมูลนัด · แยกจากการยกเลิกนัด · ต้องยืนยันก่อนลบ</p></div>${btn('Delete Meeting',"openModal('delete')",'danger')}</section>`)}
function openModal(kind){modalReturn=document.activeElement;let x=active();let body='';if(kind==='delete')body=`<div class="eyebrow">DELETE RECORD / ลบข้อมูล</div><h2 id="dialog-title">Delete this meeting?</h2><p><b>${esc(x.title)}</b><br>${dateText(x.date)} · ${x.start}–${x.end}</p><div class="note">ข้อเสนอ: ลบรายการนี้ออกจากรายการนัด<br>ต่างจาก Cancel ที่คงข้อมูลไว้<br>ผลต่อ notes / history / Calendar ยังต้องยืนยัน</div><div class="row">${btn('Keep Meeting','closeModal()')}${btn('Delete Meeting','deleteRecord()','primary')}</div>`;if(kind==='cancel')body=`<div class="eyebrow">CANCEL / ยกเลิกการนัด</div><h2 id="dialog-title">Cancel this meeting?</h2><p>${esc(x.name)} · ${dateText(x.date)} · ${x.start}–${x.end}</p><div class="note">ข้อเสนอ: เปลี่ยนสถานะเป็น Cancelled และคงข้อมูลนัดไว้ ไม่ลบ record<br>ยังไม่มีการแจ้งผู้สมัครหรือเปลี่ยน Google Calendar จริง</div><div class="row">${btn('Keep Scheduled','closeModal()')}${btn('Confirm Cancellation',"active().status='Cancelled';closeModal();notice='ยกเลิกนัดในต้นแบบ · ข้อมูลยังอยู่';render()",'primary')}</div>`;if(kind==='feedback')body=`<div class="eyebrow">FEEDBACK / ข้อเสนอ</div><h2 id="dialog-title">Add Feedback</h2><p class="sub">ตัวอย่างบันทึกข้อความ ยังไม่กำหนดคะแนนหรือผลผ่าน/ไม่ผ่าน</p><label for="feedback-text">Interview feedback</label><textarea id="feedback-text" placeholder="เช่น อธิบายแนวทางแก้ปัญหาได้เป็นลำดับ"></textarea><p class="help">ผู้ที่เพิ่ม/อ่าน/แก้ไข และการเก็บประวัติยังต้องยืนยัน</p><div class="row">${btn('Back','closeModal()')}${btn('Save Feedback','saveFeedback()','primary')}</div>`;$('#modal-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${body}</section></div>`;$('.modal button').focus()}
function saveFeedback(){let t=$('#feedback-text').value.trim();if(!t){$('#feedback-text').focus();return}feedback.push(t);closeModal();notice='เพิ่ม feedback ในต้นแบบแล้ว';render()}
function closeModal(){$('#modal-root').innerHTML='';modalReturn?.focus()}
function deleteRecord(){records.splice(records.findIndex(x=>x.id===active().id),1);page=1;closeModal();notice='ลบรายการจากต้นแบบแล้ว';go('dashboard')}

function toggleMeeting(id){const article=document.querySelector('[data-record="'+id+'"]'),button=article?.querySelector('.card-toggle'),panel=article?.querySelector('.card-expanded');if(!button||!panel)return;const expanded=!expandedMeetings.has(id),from=panel.hidden?0:panel.getBoundingClientRect().height;disclosureAnimations.get(panel)?.cancel();expanded?expandedMeetings.add(id):expandedMeetings.delete(id);button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',(expanded?'Collapse ':'Expand ')+records.find(x=>x.id===id).name+' meeting summary');const glyph=button.querySelector('.expand-chevron svg');glyph.getAnimations().forEach(a=>a.cancel());glyph.querySelector('path').setAttribute('d',expanded?'M6 15l6-6 6 6':'M6 9l6 6 6-6');panel.hidden=false;panel.inert=!expanded;panel.style.height='';panel.style.opacity='';panel.style.overflow='';const target=expanded?panel.getBoundingClientRect().height:0;button.focus({preventScroll:true});if(matchMedia('(prefers-reduced-motion: reduce)').matches){panel.hidden=!expanded;return}panel.style.overflow='hidden';const animation=panel.animate([{height:from+'px',opacity:expanded?0:1},{height:target+'px',opacity:expanded?1:0}],{duration:220,easing:'cubic-bezier(.2,.7,.2,1)'});disclosureAnimations.set(panel,animation);glyph.animate([{transform:'rotate(180deg)'},{transform:'rotate(0deg)'}],{duration:180,easing:'ease-out'});animation.finished.then(()=>{if(disclosureAnimations.get(panel)!==animation)return;panel.hidden=!expanded;panel.style.overflow='';disclosureAnimations.delete(panel)}).catch(()=>{})}

function meetingSection(key,items){

  const latest=[...items].sort((a,b)=>meetingEnd(b).localeCompare(meetingEnd(a))||String(a.id).localeCompare(String(b.id))).slice(0,5);
  return `<section class="meeting-section" data-section="${key}"><div class="row between"><h2>${title}</h2><span class="count-chip">${count} meetings</span></div>${count?`<p class="help">Latest ${latest.length} of ${count} · ${longDate(chosenDate)}</p><div${key==='past'?' id="past-list"':''}>${latest.map(card).join('')}</div>`:`<div class="section-empty"><strong>${empty}</strong><p>ไม่มีนัดในส่วนนี้สำหรับ ${dateText(chosenDate)}</p></div>`}</section>`;
 }
 const size=10,max=Math.max(1,Math.ceil(count/size));sectionPages[key]=Math.min(sectionPages[key]||1,max);const p=sectionPages[key];
 return `<section class="meeting-section" data-section="${key}"><div class="row between"><h2>${title}</h2><span class="count-chip">${count} meetings</span></div>${count?items.slice((p-1)*size,p*size).map(card).join(''):`<div class="section-empty"><strong>${empty}</strong><p>ไม่มีนัดในส่วนนี้สำหรับ ${dateText(chosenDate)}</p></div>`}${count>size?`<div class="pagination"><span>${(p-1)*size+1}–${Math.min(p*size,count)} of ${count}</span><div class="row"><button aria-label="Previous ${key} page" ${p===1?'disabled':''} onclick="sectionPages.${key}--;render()">Previous</button><span>Page ${p} / ${max}</span><button aria-label="Next ${key} page" ${p===max?'disabled':''} onclick="sectionPages.${key}++;render()">Next</button></div></div>`:''}</section>`;

const s1CreatedMeetings=new Map();
let s1CreateOperation=null;
function s1Form(){const form=$('#meeting-form');return teamPickerMode==='form'&&!editMode&&location.hash==='#booking'&&$('#type')?.value==='Onsite'?form:null}
function s1Current(op){return !!op&&op.form===s1Form()&&op.form.isConnected&&op.author===staffProfile&&op.namespace===mockSaveKey&&!guestSession&&!deniedCandidateEmail}
function s1SelectedMembers(){return companyMembers.filter(m=>m.id!==staffProfile&&teamSelection.includes(m.id))}
const s1PreviousBooking=booking;
booking=function(edit=false){
 if(!edit&&notice==='สร้างนัดและทีมแล้ว')notice='';
 const result=s1PreviousBooking(edit);
 if(!edit){teamSelection=teamSelection.filter(id=>id!==staffProfile);s1MemberSearch.generation++;s1MemberSearch.form=null;s1CreateOperation=null}
 return result;
};
const s1PreviousErrors=meetingFormErrors;
meetingFormErrors=function(value){const errors=s1PreviousErrors(value);if(s1Form()&&!s1SelectedMembers().length)errors['interview-team-search']='เลือกผู้ร่วมสัมภาษณ์อย่างน้อย 1 คน โดยไม่นับผู้จัดนัด';return errors};
const s1PreviousMatches=teamMatches;
teamMatches=function(){
 const matches=s1PreviousMatches();if(!s1Form())return matches;
 return s1MemberSearch.phase==='ready'&&s1MemberSearch.query===teamQuery.trim()?matches.filter(m=>m.id!==staffProfile&&s1MemberSearch.ids.includes(m.id)):[];
};
async function s1SearchMembers(retry=false){
 const form=s1Form(),query=teamQuery.trim();if(!form||!query||form.dataset.saving==='true')return;
 if(!retry&&s1MemberSearch.form===form&&s1MemberSearch.query===query)return;
 const generation=++s1MemberSearch.generation,author=staffProfile;
 Object.assign(s1MemberSearch,{form,query,phase:'loading',ids:[]});
 if(retry){teamOpen=true;$('#interview-team-search').focus()}
 const matches=s1PreviousMatches().filter(m=>m.id!==author).map(m=>m.id);
 updateTeamPicker();
 try{
  const ids=await mockRequest('searchMembers',()=>matches);
  if(generation!==s1MemberSearch.generation||s1Form()!==form||staffProfile!==author||teamQuery.trim()!==query)return;
  Object.assign(s1MemberSearch,{phase:'ready',ids});
 }catch(error){
  if(generation!==s1MemberSearch.generation||s1Form()!==form||staffProfile!==author||teamQuery.trim()!==query)return;
  Object.assign(s1MemberSearch,{phase:'error',ids:[]});
 }
 if(generation===s1MemberSearch.generation&&s1Form()===form)updateTeamPicker();
}
const s1PreviousUpdateTeam=updateTeamPicker;
updateTeamPicker=function(message=''){
 const form=s1Form();if(!form)return s1PreviousUpdateTeam(message);
 teamSelection=s1SelectedMembers().map(m=>m.id);
 const query=teamQuery.trim();
 if(!query){if(s1MemberSearch.query||s1MemberSearch.form!==form)s1MemberSearch.generation++;Object.assign(s1MemberSearch,{form,query:'',phase:'idle',ids:[]})}
 else if(s1MemberSearch.form!==form||s1MemberSearch.query!==query){void s1SearchMembers();return}
 s1PreviousUpdateTeam(message);
 const input=$('#interview-team-search'),list=$('#team-options');
 let state=$('#s1-member-state');if(!state){state=document.createElement('div');state.id='s1-member-state';state.className='help';list.after(state)}
 input.setAttribute('aria-busy',String(s1MemberSearch.phase==='loading'));
 input.setAttribute('aria-describedby','team-help team-status s1-member-state');
 state.setAttribute('role',s1MemberSearch.phase==='error'?'alert':'status');
 state.innerHTML=s1MemberSearch.phase==='loading'?saveSpinner()+' กำลังค้นหาสมาชิก…':s1MemberSearch.phase==='error'?'<div class="save-error">ค้นหาสมาชิกไม่สำเร็จ รายชื่อที่เลือกยังอยู่ <button type="button" onclick="s1SearchMembers(true)">ลองค้นหาอีกครั้ง</button></div>':'';
 if(s1MemberSearch.phase!=='ready'||!query){list.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant')}
 $('#team-status').textContent=message||teamSelection.length+' selected · ไม่นับผู้จัดนัด';
};
const s1PreviousSelectTeam=selectTeamMember,s1PreviousRemoveTeam=removeTeamMember;
selectTeamMember=function(id){if(s1Form()&&(s1Form().dataset.saving==='true'||id===staffProfile||!teamMatches().some(m=>m.id===id)))return;return s1PreviousSelectTeam(id)};
removeTeamMember=function(id){if(s1Form()&&s1Form().dataset.saving==='true')return;return s1PreviousRemoveTeam(id)};
const s1PreviousOutcome=setMockSaveOutcome;
setMockSaveOutcome=function(value){
 s1PreviousOutcome(value);mockSavePreview.s1Outcome=value;
 if(value==='member-search-fail')mockSavePreview.failNext.searchMembers=true;
 if(value==='meeting-read-fail')mockSavePreview.failNext.readMeeting=true;
};
const s1PreviousPreviewBar=previewBar;
previewBar=function(){
 s1PreviousPreviewBar();const select=$('#mock-save-outcome');if(!select)return;
 for(const [value,label]of [['member-search-fail','S1: fail next member search'],['meeting-unknown-committed','S1: save response lost after commit'],['meeting-unknown-uncommitted','S1: save response lost before commit'],['meeting-read-fail','S1: saved, next readback fails']]){
  if(![...select.options].some(o=>o.value===value)){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option)}
 }
};
function s1PaintCreate(op){
 if(!s1Current(op))return;
 const frozen=['saving','unknown','reading','read-error'].includes(op.phase);
 op.form.dataset.saving=String(frozen);
 for(const [control,disabled]of op.controls)control.disabled=frozen||disabled;
 op.button.setAttribute('aria-busy',String(op.phase==='saving'));
 op.button.innerHTML=op.phase==='saving'?saveSpinner()+'Saving…':op.buttonLabel;
 const box=$('#form-error');box.setAttribute('role',['unknown','write-error','read-error'].includes(op.phase)?'alert':'status');box.setAttribute('tabindex','-1');
 const messages={saving:saveSpinner()+' กำลังบันทึกนัดและทีม…',unknown:'ยังยืนยันผลการบันทึกไม่ได้ ข้อมูลเดิมถูกเก็บไว้ กรุณาลองคำขอเดิมอีกครั้งก่อนแก้ไข <button type="button" onclick="s1RetryCreate()">ลองบันทึกคำขอเดิมอีกครั้ง</button>',reading:saveSpinner()+' บันทึกแล้ว กำลังโหลดข้อมูลล่าสุด…','write-error':'บันทึกนัดและทีมไม่สำเร็จ ข้อมูลที่กรอกยังอยู่ แก้ไขหรือลองบันทึกอีกครั้ง','read-error':'บันทึกแล้ว แต่โหลดข้อมูลล่าสุดไม่สำเร็จ <button type="button" onclick="s1RetryReadback()">ลองโหลดข้อมูลล่าสุดอีกครั้ง</button>'};
 box.innerHTML='<div class="'+(['unknown','write-error','read-error'].includes(op.phase)?'error':'help')+'">'+messages[op.phase]+'</div>';
 if(['unknown','write-error','read-error'].includes(op.phase))box.focus();
}
function s1CreateKey(op){return op.namespace+':'+op.author+':'+op.requestId}
async function s1RunCreate(op){
 if(!s1Current(op)||['saving','reading'].includes(op.phase))return;
 op.phase='saving';s1PaintCreate(op);
 const outcome=mockSavePreview.s1Outcome;mockSavePreview.s1Outcome='success';
 try{
  await mockRequest('write',()=>{
   if(!s1Current(op))throw Error('Identity or form changed');
   if(outcome==='meeting-unknown-uncommitted')throw Object.assign(Error('Unknown response'),{unknown:true});
   const key=s1CreateKey(op);if(!s1CreatedMeetings.has(key))s1CreatedMeetings.set(key,structuredClone(op.payload));
   if(outcome==='meeting-unknown-committed')throw Object.assign(Error('Unknown response'),{unknown:true});
  });
 }catch(error){if(s1Current(op)){op.phase=error.unknown?'unknown':'write-error';s1PaintCreate(op)}return}
 if(s1Current(op))await s1Readback(op);
}
async function s1Readback(op){
 if(!s1Current(op))return;op.phase='reading';s1PaintCreate(op);
 try{
  const saved=await mockRequest('readMeeting',()=>structuredClone(s1CreatedMeetings.get(s1CreateKey(op))));
  if(!s1Current(op))return;if(!saved)throw Error('Readback unavailable');
  if(!records.some(x=>x.id===saved.id)){records.unshift(saved);staffDemoProfiles[op.author].allowed.push(saved.id)}
  op.phase='complete';selected=saved.id;chosenDate=saved.date;weekStart=monday(saved.date);sectionPages={upcoming:1,cancelledRejected:1,past:1};state='normal';notice='สร้างนัดและทีมแล้ว';previewMessage='S1 browser-only simulation · no DB/API/provider';go('detail');
 }catch(error){if(s1Current(op)){op.phase='read-error';s1PaintCreate(op)}}
}
function s1RetryCreate(){const op=s1CreateOperation;if(op?.phase==='unknown')void s1RunCreate(op)}
function s1RetryReadback(){const op=s1CreateOperation;if(op?.phase==='read-error')void s1Readback(op)}
const s1PreviousSaveMeeting=saveMeeting;
saveMeeting=async function(event){
 const form=s1Form();if(!form)return s1PreviousSaveMeeting(event);
 event.preventDefault();if(form.dataset.saving==='true'||guestSession||deniedCandidateEmail||form.dataset.meetingAuthor!==staffProfile)return;
 const payload={};for(const key of ['name','role','title','date','start','end','status','type','location','description','notes'])payload[key]=$('#'+key).value.trim();
 payload.endDate=$('#end-date').value.trim();payload.email=$('#candidate-email').value.trim();payload.location=payload.location||null;payload.provider='';payload.meetingUrl='';
 const errors=meetingFormErrors(payload);showMeetingErrors(errors);if(Object.keys(errors).length)return;
 Object.assign(payload,{id:Date.now(),organizerId:staffProfile,team:s1SelectedMembers().map(m=>m.email).join(', '),interviewNotes:'',notesByAuthor:{},notesDraftByAuthor:{},feedback:[],history:[],calendar:null});
 const button=form.querySelector('button[type="submit"]');
 s1CreateOperation={form,author:staffProfile,namespace:mockSaveKey,requestId:crypto.randomUUID(),payload:structuredClone(payload),phase:'idle',button,buttonLabel:button.innerHTML,controls:[...form.querySelectorAll('input,select,textarea,button')].map(el=>[el,el.disabled])};
 await s1RunCreate(s1CreateOperation);
};
if(new URLSearchParams(location.search).get('feedbackDemo')==='100')setFeedbackFixture('demo100');

/* REVISION_END */
window.addEventListener('hashchange',()=>{notice=notice;render();window.scrollTo(0,0)});render();
</script></body></html>
