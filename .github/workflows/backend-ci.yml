name: Backend CI

on:
  push:
    branches: [codex/feature-login, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --no-file-parallelism --maxWorkers 1
      - run: npm run test:integration:isolated
      - run: npm run build
      - name: Build production image
        run: docker build --target runtime -t meeting-manager-backend:ci .
