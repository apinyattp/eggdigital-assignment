name: Frontend CI

on:
  push:
    branches: [codex/feature-login, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - name: Build same-origin production frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          # Reserved test hostname: build validates routing without contacting BE.
          API_PROXY_ORIGIN: https://backend.invalid
        run: npm run build
      - name: Install frontend regression browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test navigation, member pagination, date/time pickers, and mobile Login
        timeout-minutes: 5
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          API_PROXY_ORIGIN: https://backend.invalid
          FE_TEST_ORIGIN: http://127.0.0.1:3100
          PICKER_BROWSERS: chromium,webkit
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > /tmp/navigation-frontend.log 2>&1 &
          navigation_server_pid=$!
          trap 'kill "$navigation_server_pid" 2>/dev/null || true; wait "$navigation_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$FE_TEST_ORIGIN/login" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:navigation
          npm run test:member-picker
          npm run test:date-time-picker
          npm run test:login-mobile
      - name: Build production image
        run: >-
          docker build --target runtime
          --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1
          --build-arg API_PROXY_ORIGIN=https://backend.invalid
          -t meeting-manager-frontend:ci .
